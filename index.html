<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('background.jpg') no-repeat center center fixed; /* Βάλε εδώ την εικόνα σου */
      background-size: cover;
      position: relative;
      color: white;
      text-align: center;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background-color: rgba(112, 164, 6, 0.5); /* Λαχανί με διαφάνεια */
      z-index: -1;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.75);
      width: 95%;
      max-width: 520px;
      margin: 30px auto;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    .logo img {
      width: 100px;
      border-radius: 20px;
      margin-bottom: 1px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.6rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
      padding: 14px;
      width: 100%;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      color: white;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    .btn img {
      height: 20px;
      vertical-align: middle;
    }

    .menu-btn { background-color: #d4af37dd; }
    .shop-btn { background-color: #77aa4eb1; }
    .call-btn,
    .efood-btn,
    .box-btn,
    .wolt-btn,
    .map-btn,
    .reviews-btn {
      background-color: white;
      color: black;
    }

    .section-title {
      margin: 25px 0 10px;
      font-weight: bold;
      border-top: 1px solid white;
      border-bottom: 1px solid white;
      padding: 5px 0;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .footer-icons {
      margin-top: 20px;
    }

    .footer-icons a {
      margin: 0 10px;
      color: white;
      font-size: 1.3rem;
      transition: transform 0.2s;
    }

    .footer-icons a:hover {
      transform: scale(1.2);
    }

    @media (max-width: 400px) {
      .logo img {
        width: 80px;
      }

      h1 {
        font-size: 1.3rem;
      }

      .btn {
        font-size: 0.9rem;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="logo.png" alt="Λογότυπο">
    </div>
    <h1>Local - Coffee & more</h1>

    <a href="menu.html" class="btn menu-btn"><i class="fas fa-book-open"></i> Menu</a>
    
    <div class="section-title">Order</div>
    <a href="tel:+1234567890" class="btn call-btn"><i class="fas fa-phone"></i> Τηλέφωνο</a>
    <a href="https://www.e-food.gr/delivery/patra/local-7981963" class="btn efood-btn"><img src="efood.png" alt="efood"> e-food</a>
    <div class="section-title">About Us</div>
    <a href="https://g.co/kgs/bcvcqqL" class="btn map-btn"><i class="fas fa-map-marker-alt"></i> Χάρτης</a>
    <a href="https://g.co/kgs/hXLey9Q" class="btn reviews-btn"><i class="fas fa-star"></i> Google Reviews</a>

    <div class="footer-icons">
      <a href="https://www.facebook.com/profile.php?id=61574714537124"><i class="fab fa-facebook"></i></a>
      <a href="https://www.instagram.com/local_cafepatras/"><i class="fab fa-instagram"></i></a>
      <a href="https://www.instagram.com/local_cafepatras/"><i class="fab fa-tiktok"></i></a>
    </div>
  </div>
</body>
</html>
